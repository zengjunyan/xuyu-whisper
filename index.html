<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-theme-mode="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF6EF" id="theme-color-meta" />
    <meta name="description" content="絮语 Whisper —— 一个只在你的设备上运行的轻量动态记录应用。" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>絮语 Whisper · 把此刻轻轻放下</title>
    <script>
      // 首屏绘制前确定主题：system 跟随系统，light / dark 为手动覆盖
      (function () {
        var mode = "system";
        try {
          mode = localStorage.getItem("whisper.theme.v2") || "system";
        } catch (err) {
          mode = "system";
        }
        if (mode !== "light" && mode !== "dark" && mode !== "system") mode = "system";

        var prefersDark =
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var resolved = mode === "system" ? (prefersDark ? "dark" : "light") : mode;

        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themeMode = mode;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p class="noscript">絮语需要启用 JavaScript 才能使用，请在浏览器设置中开启后刷新页面。</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
